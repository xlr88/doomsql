name: Verify bundled questions
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run every bundled question's solution against SQLite
        run: python generate_sql_ques/validate_questions.py
